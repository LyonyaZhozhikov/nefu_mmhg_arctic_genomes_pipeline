# Настройки автоприёма (ngs intake). Копия лежит в /home/ngs/raredisease-setup/conf/intake.conf,
# правьте её (повторная установка install_ngs.sh её не перезаписывает).
INTAKE_INBOX=/mnt/d/data_annotated/Очередь   # сюда кладёте папки пациентов (ФИО)
INTAKE_WORK=/mnt/d/data_annotated            # здесь папка пациента лежит, пока образец считается
INTAKE_DONE_PDF=/mnt/d/1_fastq_rec           # готовые, в папке пациента есть PDF
INTAKE_DONE_NOPDF=/mnt/d/2_fastq             # готовые без PDF
INTAKE_TARGET=5          # сколько образцов держать готовыми в очереди (кроме того, что считается)
INTAKE_MIN_FREE_GB=1000  # после копирования образца на /data должно оставаться столько ГБ
INTAKE_MIN_RAM_GB=24     # копировать с D:, только если свободно столько ГБ памяти
INTAKE_PERIOD_MIN=10     # как часто проверять Очередь, минут
